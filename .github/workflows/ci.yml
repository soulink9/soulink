# 主干守护：push/PR 跑 vet + 全量测试。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./... -count=1
      # launcher 的 Node 单测（test/launcher.test.js）：不在这里跑就形同虚设
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test
