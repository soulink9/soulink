version: 2
project_name: soulink

before:
  hooks:
    - go mod tidy

builds:
  - id: soulink
    main: ./cmd/soulink
    binary: soulink
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # 内置默认 hub 地址的来源是源码里的 main.defaultServer；此处仅在设置了
    # SOULINK_DEFAULT_SERVER 时追加覆盖（换牌/自托管发布用）。未设置则不注入，
    # 避免同一地址在源码与发布配置里出现两份真相。
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}{{ if isEnvSet "SOULINK_DEFAULT_SERVER" }} -X main.defaultServer={{ .Env.SOULINK_DEFAULT_SERVER }}{{ end }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
  - id: windows
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds: [soulink]
    files:
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  use: git
