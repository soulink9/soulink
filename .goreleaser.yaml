version: 2
project_name: soulink

before:
  hooks:
    - go mod tidy

builds:
  - id: soulink
    main: ./cmd/soulink
    binary: soulink
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
  - id: windows
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds: [soulink]
    files:
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  use: git
